
# Phase 2 DNS Configuration
# Private service platform

# Listen on the DNS server's interface
# Replace the IP with your actual DNS server IP
listen-address=127.0.0.1,10.7.22.184

# DNS port
port=53

# Domain for private network
domain=team1.test

# DNS TTL for locally generated records
local-ttl=30

# Private application DNS record
# Replace the IP with the actual primary Nginx IP
address=/app.team1.test/10.7.22.185

# Do not forward private domain requests
local=/team1.test/

# Cache DNS queries
cache-size=1000

# Do not read /etc/resolv.conf
no-resolv

# Log DNS queries during Phase 2 testing
log-queries

# Log DNS service activity
log-facility=/var/log/dnsmasq.log
