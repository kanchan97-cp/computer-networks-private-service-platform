worker_processes 1;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /tmp/nginx_cache levels=1:2
        keys_zone=my_cache:10m
        max_size=100m
        inactive=60s
        use_temp_path=off;

    upstream backend_servers {
        server 10.7.10.126:3001;
        server 10.7.21.212:3002;
    }

    server {
        listen 80;
        server_name app.team1.test;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.team1.test;

        ssl_certificate /Users/vaishnavidhanai/nginx-certs/app.team1.test.pem;
        ssl_certificate_key /Users/vaishnavidhanai/nginx-certs/app.team1.test-key.pem;

        location / {
            proxy_cache my_cache;
            proxy_cache_valid 200 60s;

            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
