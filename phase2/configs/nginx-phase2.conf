
# Phase 2 Nginx configuration
# Backend load balancing and failover

upstream team1_backend {

    server 10.7.22.186:3001 max_fails=2 fail_timeout=10s;
    server 10.7.22.187:3002 max_fails=2 fail_timeout=10s;

    keepalive 16;
}

server {

    listen 443 ssl;
    server_name app.team1.test;

    # Existing Phase 1 certificates
    ssl_certificate /opt/homebrew/etc/nginx/ssl/app.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/app.key;

    location / {

        proxy_pass http://team1_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
